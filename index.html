<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc">
<title>Calc · Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root { color-scheme: dark; --bg:#0b1120; --panel:#121b2d; --key:#202c40; --key2:#293951; --accent:#72a7ff; --text:#f4f7ff; --muted:#93a3bc; --good:#b9d3ff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body { min-height:100svh; padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); display:flex; justify-content:center; }
.app { width:min(100%,440px); display:flex; flex-direction:column; min-height:calc(100svh - 34px); gap:16px; }
header { display:flex; align-items:center; justify-content:space-between; padding:8px 2px 0; }
.brand { font-size:14px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
.pill { font-size:12px; color:#c8dcff; background:#1b2b46; border:1px solid #304766; padding:6px 9px; border-radius:999px; }
.display { background:linear-gradient(145deg,#162238,#101827); border:1px solid #25334b; border-radius:24px; padding:20px 18px 18px; min-height:174px; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; box-shadow:0 12px 34px #0002; }
.previous { color:var(--muted); min-height:20px; text-align:right; font-size:15px; overflow-wrap:anywhere; }
.output { text-align:right; font-size:clamp(36px,10vw,54px); line-height:1.08; font-weight:550; letter-spacing:-.04em; overflow-wrap:anywhere; min-height:58px; }
.display-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
.mini { border:0; color:#c4d8f8; background:#243650; border-radius:10px; padding:7px 10px; font-size:12px; }
.keys { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; flex:1; grid-auto-rows:minmax(58px,1fr); }
button.key { border:1px solid #ffffff08; border-radius:18px; background:var(--key); color:var(--text); font-size:24px; font-weight:500; box-shadow:0 3px 0 #0003; cursor:pointer; touch-action:manipulation; }
button.key:active { transform:scale(.97); background:var(--key2); }
button.utility { color:#c9dcfb; background:#1a2940; font-size:19px; }
button.operator { color:#e1ecff; background:#243b5c; }
button.equals { background:var(--accent); color:#071427; font-size:27px; font-weight:700; }
button.zero { grid-column:span 2; text-align:left; padding-left:25px; }
footer { color:#74859f; font-size:11px; text-align:center; padding:0 8px; }
@media (max-height:700px) { .app{gap:10px}.display{min-height:135px;padding:15px}.keys{gap:7px;grid-auto-rows:minmax(48px,1fr)}button.key{border-radius:14px} }
</style>
</head>
<body>
<main class="app">
  <header><div class="brand">CALC / BASIC</div><div class="pill">Prototype 0.1</div></header>
  <section class="display" aria-live="polite">
    <div class="previous" id="previous">Ready</div>
    <div class="output" id="output">0</div>
    <div class="display-bottom"><span id="status">Standard mode</span><button class="mini" id="copy" type="button">Copy result</button></div>
  </section>
  <section class="keys" aria-label="Calculator keypad">
    <button class="key utility" data-action="clear">AC</button>
    <button class="key utility" data-action="sign">+/−</button>
    <button class="key utility" data-action="percent">%</button>
    <button class="key operator" data-op="÷">÷</button>
    <button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×">×</button>
    <button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−">−</button>
    <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+">+</button>
    <button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals">=</button>
  </section>
  <footer>Local prototype · Calculations stay on this device</footer>
</main>
<script>
(() => {
 const out = document.getElementById('output'), prev = document.getElementById('previous'), status = document.getElementById('status');
 let current = '0', stored = null, operator = null, replace = false, expression = '';
 const pretty = s => s.replace(/-/g,'−');
 function show(){ out.textContent = pretty(current); }
 function number(n){ if(replace){ current=n; replace=false; } else if(current==='0'){ current=n; } else if(current.length<16){ current+=n; } show(); }
 function decimal(){ if(replace){ current='0.'; replace=false; } else if(!current.includes('.')) current+='.'; show(); }
 function fmt(n){ if(!Number.isFinite(n)) throw Error('Cannot divide by zero'); if(Math.abs(n)>1e15 || (Math.abs(n)>0 && Math.abs(n)<1e-7)) return n.toExponential(8).replace(/\.?0+e/,'e'); return String(Number(n.toPrecision(12))); }
 function calc(a,b,op){ switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':if(b===0) throw Error('Cannot divide by zero'); return a/b;} }
 function choose(op){ const n=Number(current); if(operator && !replace){ try{ current=fmt(calc(stored,n,operator)); }catch(e){current='Error';status.textContent=e.message;operator=null;stored=null;show();return;} show(); } stored=Number(current); operator=op; expression=pretty(current)+' '+op; prev.textContent=expression; replace=true; }
 function equals(){ if(operator===null || stored===null) return; const a=stored,b=Number(current),op=operator; try{ const result=fmt(calc(a,b,op)); prev.textContent=pretty(String(a))+' '+op+' '+pretty(String(b))+' ='; current=result; status.textContent='Calculated'; }catch(e){current='Error';status.textContent=e.message;} operator=null;stored=null;replace=true;show(); }
 function clear(){current='0';stored=null;operator=null;replace=false;expression='';prev.textContent='Ready';status.textContent='Standard mode';show();}
 function act(a){ if(a==='clear')clear(); if(a==='decimal')decimal(); if(a==='equals')equals(); if(a==='sign' && current!=='0' && current!=='Error'){current=String(-Number(current));show();} if(a==='percent' && current!=='Error'){current=fmt(Number(current)/100);show();} }
 document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)number(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else if(b.dataset.action)act(b.dataset.action);});
 document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);status.textContent='Result copied';}catch{status.textContent='Copy unavailable in this context';}});
 document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))number(e.key);else if(e.key==='.')decimal();else if(e.key==='+')choose('+');else if(e.key==='-')choose('−');else if(e.key==='*')choose('×');else if(e.key==='/'){e.preventDefault();choose('÷');}else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Escape')clear();else if(e.key==='%')act('percent');});
 if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
